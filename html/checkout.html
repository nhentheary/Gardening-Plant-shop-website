<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantora Checkout</title>
  <link rel="stylesheet" href="/css/checkout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <header>

    <div class="logo">
      <i class="fa-solid fa-leaf"></i>
      <h2>Plantora</h2>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="plant-care.html">Plant Care</a>
      <a href="about.html">About us</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="right">
      <div class="search">
        <input type="text" placeholder="Search...">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <a href="card.html" style="color:inherit;">
        <i class="fa-solid fa-cart-shopping"></i>
      </a>
      <i class="fa-regular fa-user"></i>
    </div>

  </header>

  <!-- Progress -->
  <section class="progress">

    <div class="step done">
      <div><i class="fa fa-check"></i></div>
      <span>Cart</span>
    </div>

    <div class="line"></div>

    <div class="step active">
      <div>2</div>
      <span>Checkout</span>
    </div>

    <div class="line"></div>

    <div class="step">
      <div>3</div>
      <span>Confirmation</span>
    </div>

  </section>

  <!-- Container -->
  <div class="container">

    <div class="left">

      <!-- Delivery -->
      <div class="card">
        <h3>Delivery Details</h3>

        <label>Full Name</label>
        <input type="text" placeholder="Bopha Tep">

        <label>Street Address</label>
        <input type="text" placeholder="Street 101, Toul Kork">

        <div class="row">
          <div>
            <label>City</label>
            <input type="text" placeholder="Phnom Penh">
          </div>
          <div>
            <label>Phone</label>
            <input type="text" placeholder="096 657 9824">
          </div>
        </div>
      </div>

      <!-- Payment -->
      <div class="card">
        <h3>Payment Method</h3>

        <div class="payment active">
          <input type="radio" checked name="payment">
          <span>Credit / Debit Card</span>
          <i class="fa-regular fa-credit-card"></i>
        </div>

        <div class="payment">
          <input type="radio" name="payment">
          <span>Bank Transfer</span>
          <i class="fa-solid fa-building-columns"></i>
        </div>

        <div class="payment">
          <input type="radio" name="payment">
          <span>Cash on Delivery</span>
          <i class="fa-solid fa-money-bill-wave"></i>
        </div>

        <label>Card Number</label>
        <input type="text" placeholder="1234 5678 8888 6654">

        <div class="row">
          <div>
            <label>Expiry Date</label>
            <input type="text" placeholder="MM / YY">
          </div>
          <div>
            <label>CVV</label>
            <input type="password" placeholder="123">
          </div>
        </div>
      </div>

    </div>

    <!-- Summary -->
    <div class="summary">
      <h3>Order Summary</h3>

      <div class="product">
        <img src="images/plant1.png">
        <div>
          <h4>Echeveria Succulent</h4>
        </div>
        <b>$15.99</b>
        <i class="fa-regular fa-trash-can delete"></i>
      </div>

      <div class="product">
        <img src="images/plant2.png">
        <div>
          <h4>Zebra Haworthia</h4>
        </div>
        <b>$9.99</b>
        <i class="fa-regular fa-trash-can delete"></i>
      </div>

      <!-- Coupon -->
      <div class="coupon">
        <input type="text" id="couponInput" placeholder="Enter coupon code">
        <button id="applyCouponBtn">Apply</button>
      </div>

      <hr>

      <div class="price">
        <span>Subtotal</span>
        <span id="subtotal">$25.98</span>
      </div>

      <div class="price">
        <span>Discount</span>
        <span id="discountAmount">-$0.00</span>
      </div>

      <div class="total">
        <span>Total</span>
        <span id="total">$20.98</span>
      </div>

      <button id="orderBtn">Place Order</button>
    </div>

  </div>

  <script src="/js/checkout.js"></script>

</body>
</html>

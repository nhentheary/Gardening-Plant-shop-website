<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Successful</title>

  <link rel="stylesheet" href="/css/order-sucess.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <header>

    <div class="logo">
      <i class="fa-solid fa-leaf"></i>
      <h2>Plantora</h2>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="plant-care.html">Plant Care</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="right">
      <div class="search">
        <input type="text" placeholder="Search...">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <a href="card.html" style="color:inherit;">
        <i class="fa-solid fa-cart-shopping"></i>
      </a>
      <i class="fa-regular fa-user"></i>
    </div>

  </header>

  <!-- Main -->
  <section class="success">

    <div class="check-circle">
      <i class="fa-solid fa-check"></i>
    </div>

    <h1>Thank You For Your Order!</h1>

    <p>Your plants are being packed with care.</p>

    <!-- Receipt -->
    <div class="receipt">

      <div class="row">
        <span>Order Number</span>
        <span>#PL-20394</span>
      </div>

      <div class="row">
        <span>Estimated Delivery</span>
        <span>Jul 8, 2026</span>
      </div>

      <hr>

      <div class="item">
        <span>Echeveria Succulent ×1</span>
        <span>$15.99</span>
      </div>

      <div class="item">
        <span>Zebra Haworthia ×1</span>
        <span>$9.99</span>
      </div>

      <div class="item">
        <span>Discount</span>
        <span>-$5.00</span>
      </div>

      <hr>

      <div class="total">
        <span>Total</span>
        <span>$20.98</span>
      </div>

    </div>

    <div class="buttons">
      <button id="trackBtn" class="green">Track Order</button>
      <button id="shopBtn" class="white">Continue Shopping</button>
    </div>

  </section>

  <script src="/js/order-sucess.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantora | Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/cart.css">

</head>
<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success py-3">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                <img src="images/logo.png" width="45">
                Plantora
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbar">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="shop.html">Shop</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="plant-care.html">Plant Care</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>

                </ul>

                <form class="d-flex me-3">

                    <input class="form-control"
                        type="search"
                        placeholder="Search...">

                </form>

                <div class="d-flex gap-3 fs-5 text-white">

                    <i class="bi bi-search"></i>

                    <a href="card.html" class="cart-icon-link text-white">
                        <i class="bi bi-cart3"></i>
                        <span class="cart-badge" style="display:none;">0</span>
                    </a>
                    <i class="bi bi-person-circle"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- ================= CART ================= -->
    
    <section class="cart-section py-5">
        <div class="container">

        <!-- Checkout Steps -->

        <div class="checkout-step mb-5">
            <div class="step active">
                <span>1</span>
                <p>Cart</p>
            </div>
                <div class="line"></div>
                <div class="step">
                    <span>2</span>
                    <p>Checkout</p>
                </div>
                <div class="line"></div>
                <div class="step">
                    <span>3</span>
                    <p>Confirmation</p>
                </div>
            </div>

            <div class="row g-4">

                <!-- ================= LEFT ================= -->

                <div class="col-lg-7">
                    <div class="cart-box">
                        <h5 class="mb-4" id="cartCount">Your Cart (0 Items)</h5>
                        <div id="cartItemsContainer">
                            <!-- Cart items injected by js/card.js -->
                        </div>
                        <p id="emptyCartMessage" class="text-muted text-center py-4" style="display:none;">Your cart is empty. <a href="shop.html">Continue shopping</a></p>

                        <!-- Coupon -->

                        <div class="coupon mt-4">
                            <input id="couponInput" type="text" class="form-control" placeholder="Enter coupon code">
                            <button class="btn btn-success" id="applyCouponBtn">Apply</button>
                        </div>
                    </div>
                </div>

                <!-- ================= RIGHT ================= -->
                <div class="col-lg-5">
                    <div class="summary-box">
                        <h5>Order Summary</h5>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Discount</span>
                            <span id="discount">-$0.00</span>

                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>

                            <span>Free</span>

                        </div>

                        <hr>

                        <div class="summary-total">

                            <span>Total</span>

                            <span id="total">$0.00</span>

                        </div>

                        <button class="btn btn-success w-100 mt-4" id="checkoutBtn">

                            Proceed to Checkout

                        </button>

                        <button class="btn btn-outline-success w-100 mt-3" id="continueShoppingBtn">

                            Continue Shopping

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="/js/cart.js"></script>

</body>

</html>
